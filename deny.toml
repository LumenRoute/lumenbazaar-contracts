[graph]
targets = [
  "x86_64-unknown-linux-gnu",
  "x86_64-pc-windows-msvc",
]
all-features = true
no-default-features = false
exclude-dev = false

[advisories]
version = 2
ignore = [
  { id = "RUSTSEC-2024-0436", reason = "Unmaintained paste 1.0.15 inherited via soroban-sdk 28.0.0 host-side test dependencies; tracked in audits/dependency-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
]

[licenses]
version = 2
confidence-threshold = 0.8
unused-allowed-license = "deny"
allow = [
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "MIT",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[bans]
multiple-versions = "deny"
wildcards = "deny"
allow-wildcard-paths = true
highlight = "all"
workspace-default-features = "allow"
external-default-features = "allow"
allow = []
deny = []
skip = [
  { crate = "block-buffer@0.10.4", reason = "Inherited via soroban-env-host 28.0.2 crypto stack (digest 0.10 vs 0.11); tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "cpufeatures@0.2.17", reason = "Inherited via soroban-env-host 28.0.2 crypto stack (sha2 0.10 vs digest 0.11); tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "crate-git-revision@0.0.6", reason = "Inherited via stellar-xdr 28.0.0 vs soroban-env-common 28.0.2; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "crypto-common@0.1.6", reason = "Inherited via soroban-env-host 28.0.2 crypto stack (digest 0.10 vs 0.11); tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "curve25519-dalek@4.1.3", reason = "Inherited via ed25519-dalek 2.2.0 vs soroban-env-host 28.0.2; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "darling@0.20.11", reason = "Inherited via soroban-sdk-macros 28.0.0 vs serde_with_macros 3.22.0; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "darling_core@0.20.11", reason = "Inherited via darling 0.20.11; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "darling_macro@0.20.11", reason = "Inherited via darling 0.20.11; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "digest@0.10.7", reason = "Inherited via soroban-env-host 28.0.2 crypto stack alongside digest 0.11.3; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "hashbrown@0.15.5", reason = "Inherited via indexmap 2.x / soroban-env-host 28.0.2 alongside hashbrown 0.17.1; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "stellar-strkey@0.0.13", reason = "Inherited via soroban-sdk 28.0.0 alongside stellar-strkey 0.0.16; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
  { crate = "syn@2.0.119", reason = "Inherited via proc-macro ecosystem alongside syn 3.0.4; tracked in audits/cargo-deny-exceptions.json (owner: contracts-maintainers, expires: 2027-05-19)" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
